services:
  - type: web
    name: focustube
    runtime: java
    plan: free
    rootDir: .
    buildCommand: ./mvnw clean package -DskipTests
    startCommand: java -Dserver.port=$PORT -jar target/*.jar
    healthCheckPath: /
    envVars:
      - key: FOCUSTUBE_GOOGLE_CLIENT_ID
        sync: false
      - key: FOCUSTUBE_GOOGLE_CLIENT_SECRET
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
