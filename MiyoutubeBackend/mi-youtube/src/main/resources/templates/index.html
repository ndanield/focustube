<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FocusTube</title>
    <style>
        :root {
            --bg-color: #090c16;
            --card-bg: rgba(19, 24, 41, 0.65);
            --text-main: #f5f7ff;
            --text-dim: #9fa8c3;
            --accent: #ff4d4d;
            --mx: 50%;
            --my: 35%;
        }

        body {
            background: radial-gradient(140% 110% at 0% 0%, #1d2f62 0%, transparent 35%),
                        radial-gradient(110% 90% at 100% 100%, #4c1f50 0%, transparent 36%),
                        linear-gradient(130deg, #05070d 0%, #0a1228 45%, #0b1020 100%);
            color: var(--text-main);
            font-family: 'Space Grotesk', 'Avenir Next', 'Segoe UI', sans-serif;
            margin: 0;
            padding: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            background: radial-gradient(320px circle at var(--mx) var(--my), rgba(255, 255, 255, 0.17) 0%, rgba(255, 120, 120, 0.14) 30%, rgba(255, 120, 120, 0) 70%);
            transition: background-position 0.08s linear;
        }

        .header,
        #results,
        #loader {
            position: relative;
            z-index: 1;
        }

        .header {
            width: 100%;
            max-width: 600px;
            position: sticky;
            top: 6px;
            background: rgba(9, 12, 22, 0.82);
            backdrop-filter: blur(10px);
            padding: 15px 12px 16px;
            z-index: 100;
            border: 1px solid rgba(255, 255, 255, 0.09);
            border-radius: 18px;
            box-shadow: 0 14px 28px rgba(0, 0, 0, 0.32);
        }

        .header::after {
            content: "";
            position: absolute;
            inset: -14px -22px -18px;
            background: radial-gradient(55% 70% at 20% 40%, rgba(102, 146, 255, 0.22) 0%, rgba(102, 146, 255, 0) 100%),
                        radial-gradient(45% 65% at 80% 45%, rgba(255, 112, 145, 0.20) 0%, rgba(255, 112, 145, 0) 100%),
                        linear-gradient(180deg, rgba(14, 20, 38, 0.6) 0%, rgba(14, 20, 38, 0) 100%);
            filter: blur(20px);
            opacity: 0.7;
            pointer-events: none;
            z-index: -1;
        }

        .brand {
            margin: 0 0 12px 2px;
            font-size: clamp(22px, 5vw, 34px);
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            line-height: 1;
        }

        .brand span {
            color: #ff7d7d;
            text-shadow: 0 0 18px rgba(255, 125, 125, 0.35);
        }

        .search-box {
            display: flex;
            gap: 10px;
        }

        input {
            flex-grow: 1;
            padding: 12px;
            border-radius: 25px;
            border: 1px solid rgba(255, 255, 255, 0.13);
            background: rgba(10, 16, 30, 0.88);
            color: white;
            font-size: 16px; /* Evita zoom automático en iOS */
            outline: none;
        }

        input:focus {
            border-color: rgba(255, 125, 125, 0.6);
            box-shadow: 0 0 0 3px rgba(255, 125, 125, 0.16);
        }

        button {
            padding: 10px 20px;
            border-radius: 25px;
            border: none;
            background: linear-gradient(135deg, #ff3f61 0%, #ff5f3e 100%);
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(255, 78, 78, 0.35);
        }

        #results {
            width: 100%;
            max-width: 600px;
            margin-top: 20px;
            display: grid;
            gap: 20px;
        }

        .video-card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
            text-decoration: none;
            color: inherit;
            display: block;
            border: 1px solid rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(8px);
        }

        .video-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
        }

        .video-card img {
            width: 100%;
            aspect-ratio: 16 / 9;
            object-fit: cover;
        }

        .video-info {
            padding: 12px;
        }

        .video-title {
            font-size: 16px;
            margin: 0 0 8px 0;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .channel-name {
            font-size: 14px;
            color: var(--text-dim);
        }

        /* Loading Spinner */
        .loader {
            display: none;
            border: 4px solid #333;
            border-top: 4px solid var(--accent);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="header">
        <h1 class="brand">Focus<span>TUBE</span></h1>
        <div class="search-box">
            <input type="text" id="query" placeholder="Buscar sin distracciones..." onkeypress="if(event.key==='Enter') buscar()">
            <button onclick="buscar()">Ir</button>
        </div>
    </div>

    <div id="loader" class="loader"></div>
    <div id="results"></div>

    <script>
        const rootStyle = document.documentElement.style;

        window.addEventListener('pointermove', (event) => {
            rootStyle.setProperty('--mx', `${event.clientX}px`);
            rootStyle.setProperty('--my', `${event.clientY}px`);
        });

        async function buscar() {
            const queryField = document.getElementById('query');
            const resultsDiv = document.getElementById('results');
            const loader = document.getElementById('loader');

            if(!queryField.value) return;

            // UI Feedback
            resultsDiv.innerHTML = '';
            loader.style.display = 'block';

            try {
                const response = await fetch(`/api/search?query=${encodeURIComponent(queryField.value)}`);
                const data = await response.json();
                
                resultsDiv.innerHTML = data.items.map(v => `
                    <a class="video-card" href="https://www.youtube.com/watch?v=${v.id.videoId}" target="_blank">
                        <img src="${v.snippet.thumbnails.high.url}" alt="thumbnail">
                        <div class="video-info">
                            <h3 class="video-title">${v.snippet.title}</h3>
                            <p class="channel-name">📺 ${v.snippet.channelTitle}</p>
                        </div>
                    </a>
                `).join('');
            } catch (error) {
                resultsDiv.innerHTML = `<p style="color:red">Error en la búsqueda. Revisa la consola.</p>`;
            } finally {
                loader.style.display = 'none';
            }
        }
    </script>
</body>
</html>
