services:
  - type: web
    name: focustube
    runtime: docker
    plan: free
    rootDir: .
    healthCheckPath: /
    envVars:
      - key: FOCUSTUBE_GOOGLE_CLIENT_ID
        sync: false
      - key: FOCUSTUBE_GOOGLE_CLIENT_SECRET
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
